services:
  postgres:
    image: postgres:17-alpine
    container_name: cinema-scheduler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cinema}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: cinema-scheduler-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: cinema-scheduler-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cinema-scheduler-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cinema}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-secrettokenjwt}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      SALA_CLEANUP_BUFFER_MINUTES: ${SALA_CLEANUP_BUFFER_MINUTES:-15}
      CANCELLATION_DEADLINE_HOURS: ${CANCELLATION_DEADLINE_HOURS:-3}
    volumes:
      - ./src:/app/src
      - ./init-data:/app/init-data
      - ./scripts:/app/scripts
      - ./drizzle:/app/drizzle
      - ./tsconfig.json:/app/tsconfig.json
      - ./drizzle.config.ts:/app/drizzle.config.ts
      - node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.sh"]

volumes:
  postgres_data:
  redis_data:
  node_modules:
